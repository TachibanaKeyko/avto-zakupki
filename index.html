<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>avtomatika.ru — Закупки</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Tektur:wght@900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:400 15px/1.5 Inter,sans-serif;background:#2f2f2f;color:#ddd;min-height:100vh;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;background:#262626;border-bottom:4px solid #fff200}
  .bar b{font:900 18px Tektur;color:#fff;margin-right:auto}
  .tabs{display:flex;gap:6px}
  .tabs button{font:600 14px Inter;background:transparent;color:#ccc;border:1px solid #555;border-radius:3px;padding:8px 14px;cursor:pointer}
  .tabs button.on{background:#fff200;color:#141414;border-color:#fff200}
  .bar a{color:#fff200;font-size:14px}
  .stage{flex:1;display:flex;justify-content:center;padding:24px 12px;overflow:auto}
  iframe{background:#fff;border:0;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.4);height:calc(100vh - 120px);transition:width .25s}
</style>
</head>
<body>
<div class="bar">
  <b>Закупки</b>
  <div class="tabs hvs">
    <button data-h="1">Плашка 1</button>
    <button data-h="2">Плашка 2</button>
    <button data-h="3">Плашка 3</button>
  </div>
  <div class="tabs sizes">
    <button data-w="100%">Десктоп</button>
    <button data-w="820px">Планшет</button>
    <button data-w="390px">Телефон</button>
  </div>
  <div class="tabs themes">
    <button data-t="light">День</button>
    <button data-t="dark">Ночь</button>
  </div>
  <div class="tabs tgs">
    <button data-g="a">Кнопка А</button>
    <button data-g="b">Кнопка Б</button>
  </div>
  <a id="solo" href="zakupki.html" target="_blank">Открыть отдельно</a>
</div>
<div class="stage"><iframe id="f"></iframe></div>
<script>
  const f=document.getElementById('f'),solo=document.getElementById('solo');
  const sizes={'100%':'desktop','820px':'tablet','390px':'phone'};
  const st={w:'100%',t:'light',g:'a',h:'1'};
  const [w,t,g,h]=location.hash.slice(1).split('/');
  if(['1','2','3'].includes(h))st.h=h;
  for(const k in sizes)if(sizes[k]===w)st.w=k;
  if(t==='dark')st.t='dark';
  if(g==='b')st.g='b';
  const src=()=>'zakupki.html?theme='+st.t+'&tg='+st.g+'&hv='+st.h;
  const apply=reload=>{
    if(reload)f.src=src();
    f.style.width=st.w;solo.href=src();
    document.querySelectorAll('.sizes button').forEach(b=>b.classList.toggle('on',b.dataset.w===st.w));
    document.querySelectorAll('.themes button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.t));
    document.querySelectorAll('.hvs button').forEach(b=>b.classList.toggle('on',b.dataset.h===st.h));
    document.querySelectorAll('.tgs button').forEach(b=>b.classList.toggle('on',b.dataset.g===st.g));
    history.replaceState(null,'','#'+sizes[st.w]+'/'+st.t+'/'+st.g+'/'+st.h);
  };
  document.querySelectorAll('.sizes button').forEach(b=>b.onclick=()=>{st.w=b.dataset.w;apply()});
  document.querySelectorAll('.themes button').forEach(b=>b.onclick=()=>{st.t=b.dataset.t;f.contentWindow.postMessage({setTheme:st.t},'*');apply()});
  document.querySelectorAll('.hvs button').forEach(b=>b.onclick=()=>{st.h=b.dataset.h;f.contentWindow.postMessage({setHv:st.h},'*');apply()});
  document.querySelectorAll('.tgs button').forEach(b=>b.onclick=()=>{st.g=b.dataset.g;apply(true)});
  // кнопка внутри страницы тоже двигает переключатель на витрине
  addEventListener('message',e=>{if(e.data&&e.data.avTheme){st.t=e.data.avTheme;apply()}});
  apply(true);
</script>
</body>
</html>
